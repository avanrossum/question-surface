[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The distribution is `the-docket`; plain `docket` is refused by PyPI as too
# close to an existing name. The import package and the command are both still
# `docket`, which is ordinary — pillow installs as PIL.
name = "the-docket"
dynamic = ["version"]
description = "The Docket collects your coding agent's open questions into one page you clear in a sitting, and keeps the answers as a record you can commit next to the code they decided."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Alexander van Rossum" }]
keywords = [
    "claude", "claude-code", "ai-agents", "agent-tools", "llm",
    "human-in-the-loop", "questionnaire", "decision-records", "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]
# Deliberately empty, and load-bearing. Standard library only is the reason
# this still runs unattended in a year; see docs/DESIGN.md.
dependencies = []

[project.urls]
Homepage = "https://github.com/avanrossum/docket"
Changelog = "https://github.com/avanrossum/docket/blob/main/CHANGELOG.md"
Issues = "https://github.com/avanrossum/docket/issues"

[project.scripts]
docket = "docket.cli:main"

[tool.hatch.version]
path = "docket/__init__.py"

# `packages` takes the whole directory, data files included — assets/,
# questionnaires/ and skill/ are all read at runtime and ship with the code.
# They need no force-include, and adding one puts every file in twice.
[tool.hatch.build.targets.wheel]
packages = ["docket"]

[tool.hatch.build.targets.sdist]
include = [
    "/docket",
    "/tests",
    "/scripts",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/ROADMAP.md",
    "/LICENSE",
]
