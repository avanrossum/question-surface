name: publish

# Trusted publishing: PyPI trusts this repository and this workflow filename
# directly, so no API token exists anywhere. The pending publisher on PyPI must
# name this file (docket-pypi-deploy.yml) and the `pypi` environment below.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A release that cannot pass its own suite has no business on PyPI.
      - name: Run the test suite
        run: python -m unittest discover -s tests -t .
      - name: Build the distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check the runtime data actually shipped
        # assets, the bundled questionnaire and the skill are read at runtime.
        # A wheel missing any of them installs cleanly and then fails in use.
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          names = zipfile.ZipFile(sorted(glob.glob("dist/*.whl"))[0]).namelist()
          required = [
              "docket/cli.py",
              "docket/assets/app.css",
              "docket/assets/app.js",
              "docket/assets/interview.css",
              "docket/assets/interview.js",
              "docket/questionnaires/example.json",
              "docket/skill/SKILL.md",
          ]
          missing = [n for n in required if n not in names]
          if missing:
              sys.exit("wheel is missing runtime files: " + ", ".join(missing))
          print(f"all {len(required)} runtime files present")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for trusted publishing; nothing else
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
